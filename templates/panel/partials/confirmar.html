{# Confirmación de una acción destructiva. Uso: include con titulo, mensaje y accion_url. #}
<form class="confirmar" method="post" action="{{ accion_url }}">
  {% csrf_token %}
  <h2>{{ titulo }}</h2>
  <p>{{ mensaje }}</p>
  <div class="acciones">
    <button class="boton boton-peligro" type="submit">{{ enviar|default:"Confirmar" }}</button>
    {% if cancelar_url %}<a class="boton boton-secundario" href="{{ cancelar_url }}">Cancelar</a>{% endif %}
  </div>
</form>
