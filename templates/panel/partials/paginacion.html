{# Requiere page_obj y, opcional, querystring (parámetros sin "page"). #}
{% if page_obj.has_other_pages %}
  <nav class="paginacion" aria-label="Paginación">
    {% if page_obj.has_previous %}
      <a class="boton boton-secundario" href="?page={{ page_obj.previous_page_number }}{% if querystring %}&amp;{{ querystring }}{% endif %}"
         hx-get="?page={{ page_obj.previous_page_number }}{% if querystring %}&amp;{{ querystring }}{% endif %}"
         hx-target="#listado" hx-swap="outerHTML" hx-push-url="true">Anterior</a>
    {% endif %}
    <span class="paginacion-estado">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>
    {% if page_obj.has_next %}
      <a class="boton boton-secundario" href="?page={{ page_obj.next_page_number }}{% if querystring %}&amp;{{ querystring }}{% endif %}"
         hx-get="?page={{ page_obj.next_page_number }}{% if querystring %}&amp;{{ querystring }}{% endif %}"
         hx-target="#listado" hx-swap="outerHTML" hx-push-url="true">Siguiente</a>
    {% endif %}
  </nav>
{% endif %}
