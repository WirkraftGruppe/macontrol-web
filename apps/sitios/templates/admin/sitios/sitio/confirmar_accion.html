{% extends "admin/base_site.html" %}

{% block content %}
<p>{{ consecuencia }}</p>
<ul>
  {% for objeto in objetos %}
  <li>{{ objeto }}</li>
  {% endfor %}
</ul>
<form method="post">
  {% csrf_token %}
  <input type="hidden" name="action" value="{{ accion }}">
  {% for objeto in objetos %}
  <input type="hidden" name="{{ action_checkbox_name }}" value="{{ objeto.pk }}">
  {% endfor %}
  <input type="hidden" name="confirmado" value="si">
  <input type="submit" value="Confirmar">
  <a href="{{ url_listado }}">Volver al listado</a>
</form>
{% endblock %}
