{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · MAControl S.A.</title>
  <link rel="stylesheet" href="{% static 'css/web.css' %}">
</head>
<body>
  <main class="contenedor seccion centrado">
    <img src="{% static 'img/logo.png' %}" width="96" height="96" alt="MAControl">
    <h1>Página no encontrada</h1>
    <p class="texto-suave">La dirección que buscaba no existe o ya no está disponible.</p>
    <a class="btn btn-primario" href="{% if request_path|slice:':7' == '/panel/' %}/panel/{% elif request_path|slice:':7' == '/admin/' %}/admin/{% else %}/{% endif %}">Volver al inicio</a>
  </main>
</body>
</html>
