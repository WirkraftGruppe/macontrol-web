<div class="contacto-compacto">
  <span class="eyebrow">Consultar por este servicio</span>
  <p class="texto-suave contacto-compacto-texto">Cotizaciones y coordinación de visitas por contacto directo con la empresa.</p>
  {% if config.telefono_href %}<a class="contacto-telefono contacto-telefono-compacto" href="{{ config.telefono_href }}">{{ config.telefono }}</a>{% endif %}
  <div class="contacto-acciones">
    {% if config.telefono_href %}<a class="btn btn-primario" href="{{ config.telefono_href }}">Llamar ahora</a>{% endif %}
    {% if config.whatsapp_href %}<a class="btn btn-secundario" href="{{ config.whatsapp_href }}">WhatsApp</a>{% endif %}
  </div>
</div>
