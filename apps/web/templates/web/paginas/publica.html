{% extends "web/base_web.html" %}
{% comment %}Base de las páginas públicas: título, descripción, canonical y Open Graph desde `seo`.{% endcomment %}
{% block title %}{{ seo.titulo }}{% endblock %}
{% block meta_descripcion %}{{ seo.descripcion }}{% endblock %}
{% block og %}
  <link rel="canonical" href="{{ seo.url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ seo.titulo }}">
  <meta property="og:description" content="{{ seo.descripcion }}">
  <meta property="og:url" content="{{ seo.url }}">
  <meta property="og:image" content="{{ seo.imagen }}">
{% endblock %}
